<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S4 SBPng browser run</title></head>
<body><pre id="out">running…</pre>
<script src="../../js/util.js"></script>
<script src="../../js/hash.js"></script>
<script src="util_crc32.js"></script>
<script src="png.js"></script>
<script src="bench_core.js"></script>
<script src="out/browser_fixtures.js"></script>
<script>
"use strict";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const load = async (p) => new Uint8Array(await (await fetch(p)).arrayBuffer());
async function canvasProbe(bytes, opts) {
  const bmp = await createImageBitmap(new Blob([bytes], { type: "image/png" }), opts);
  const c = new OffscreenCanvas(bmp.width, bmp.height), x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(bmp, 0, 0); const d = x.getImageData(0, 0, bmp.width, bmp.height).data;
  return Array.from({ length: bmp.width * bmp.height }, (_, i) => d[4 * i]);
}
(async () => {
  const R = { ua: navigator.userAgent, decompressionStream: typeof DecompressionStream === "function", tests: [], canvas: [], corpus: [], bench: null };
  for (const { name, b64: s, exp } of S4_FIXTURES) {
    const bytes = s ? b64(s) : await load(exp.file);
    let ok = false, detail = "";
    try {
      if (exp.tolerance) {
        let sb, browser; try { const bmp = await createImageBitmap(new Blob([bytes], { type: "image/png" })); browser = "decoded " + bmp.width + "x" + bmp.height; }
        catch (e) { browser = "rejected (" + e.name + ")"; }
        try { await SBPng.decode(bytes, { mode: "tonal" }); sb = "decoded"; } catch (e) { sb = e.code; }
        R.tolerance = R.tolerance || []; R.tolerance.push({ name, chromiumCreateImageBitmap: browser, sbpng: sb });
        continue;
      }
      if (exp.inspect) { const i = SBPng.inspect(bytes); ok = Object.entries(exp.inspect).every(([k, v]) => i[k] === v); detail = JSON.stringify(i); }
      else if (exp.checkTonal) { detail = SBPng.check(SBPng.inspect(bytes), "tonal"); ok = detail === exp.checkTonal; }
      else {
        try { const r = await SBPng.decode(bytes, { mode: exp.mode }); detail = r.sampleHash;
          ok = exp.code ? false : exp.samples ? Array.from(r.samples).join() === exp.samples : true;
          if (exp.canvas) {
            const raw = Array.from(r.samples);
            for (const o of [undefined, { colorSpaceConversion: "none" }]) {
              const cv = await canvasProbe(bytes, o); let diff = 0, maxAbs = 0;
              cv.forEach((v, i) => { if (v !== raw[i]) { diff++; maxAbs = Math.max(maxAbs, Math.abs(v - raw[i])); } });
              R.canvas.push({ name, opts: o ? JSON.stringify(o) : "default", pixels: raw.length, differingPx: diff, maxAbsDiff: maxAbs,
                sample128: cv[raw.indexOf(128)] ?? null });
            }
          }
        } catch (e) { detail = e.code || e.message; ok = exp.code ? e.code === exp.code : false; }
      }
    } catch (e) { detail = "threw " + (e.code || e.message); }
    R.tests.push({ name, ok, detail });
  }
  const corpus = ["default_write", "g8", "g8_adam7", "g8_iccp", "ga8", "pal_gray", "rgb_eq", "rgb_eq_adam7", "rgba_eq"];
  for (const n of corpus) { const r = await SBPng.decode(await load("out/corpus/" + n + ".png"), { mode: "height" }); R.corpus.push({ file: n + ".png", hash: r.sampleHash }); }
  if (location.search.includes("bench")) {
    const names = ["16mp_gray8.png", "16mp_gray8_adam7.png", "16mp_gray8_noise.png", "16mp_rgb_eq.png", "16mp_rgba_eq.png", "25mib_rgba_noise.png",
      "8mp_gray8.png", "8mp_gray8_adam7.png", "8mp_gray8_noise.png", "8mp_rgb_eq.png", "8mp_rgba_eq.png"];
    const files = []; for (const name of names) files.push({ name, bytes: await load("out/bench/" + name) });
    R.bench = await SBPngBench.run(files);
    // browser-native decode of the same file for reference (decode only, colour-managed path)
    R.nativeDecode = [];
    for (const f of files.filter((f) => /16mp_gray8.png|16mp_rgba_eq|8mp_gray8.png/.test(f.name))) {
      const t = []; for (let i = 0; i < 3; i++) { const t0 = performance.now(); const bmp = await createImageBitmap(new Blob([f.bytes])); const c = new OffscreenCanvas(bmp.width, bmp.height).getContext("2d"); c.drawImage(bmp, 0, 0); c.getImageData(0, 0, bmp.width, bmp.height); t.push(performance.now() - t0); }
      R.nativeDecode.push({ name: f.name, createImageBitmapPlusGetImageDataMs: +t.sort((a, b) => a - b)[1].toFixed(1) });
    }
    const t0 = performance.now(); let s = 0; for (let i = 0; i < 1e8; i++) s += i & 7; R.calibrationMs = +(performance.now() - t0).toFixed(0);
  }
  window.__S4 = R; document.getElementById("out").textContent = JSON.stringify(R, null, 1);
})().catch((e) => { window.__S4 = { fatal: String(e && e.stack || e) }; });
</script></body></html>
