<title>Shadowbox Harness</title>
<style>
  :root { color-scheme: light dark; --bg: #fafaf7; --fg: #1b1b1b; --muted: #555; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16171a; --fg: #e8e8e8; --muted: #aaa; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }

  p { color: var(--muted); max-width: 70ch; }
  pre { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>

<body>
<!--
  Speed round F16a (S1, F.4 #4): the browser harness. Open with ?run:
    chromium --headless=new --allow-file-access-from-files --virtual-time-budget=120000 --dump-dom "file://…/test/browser.html?run"
    or serve the repository root over http (python3 -m http.server) and open /test/browser.html?run in any browser.
  It runs the 5 F16 fixtures through the serial engine and the Blob-worker pool and prints the digests (test/browser_harness.js).
-->
<h1>Shadowbox Studio — browser harness</h1>
<p>Runs the five F16 pool-equality fixtures through the serial engine and the Blob-worker pool in this browser, and compares
the digests with each other and with the Node golden. Add <code>?run</code> to the address to start.</p>
<pre id="harness-result">Open this page with ?run to run the harness.</pre>
